name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate homepage
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Fabien Haury — D3.js Course</title>

            <style>
              * {
                box-sizing: border-box;
              }

              html {
                scroll-behavior: smooth;
              }

              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f7f7f7;
                color: #222;
              }

              /* =========================
                 INTRO
              ========================= */

              .hero {
                min-height: 90vh;
                display: flex;
                align-items: center;

                padding: 40px clamp(25px, 6vw, 100px);

                background: #f8f8f5;
                color: #111;

                position: relative;
                overflow: hidden;
              }

              .hero-inner {
                width: 100%;
                max-width: 1400px;
                margin: 0 auto;
              }

              /* -------------------------
                 TOP META
              ------------------------- */

              .hero-meta {
                display: flex;
                justify-content: space-between;

                padding-bottom: 18px;
                border-bottom: 1px solid #d8d8d2;

                font-family: monospace;
                font-size: 0.7rem;
                letter-spacing: 0.12em;
                color: #666;
              }

              /* -------------------------
                 MAIN
              ------------------------- */

              .hero-main {
                min-height: 65vh;

                display: grid;
                grid-template-columns: 1fr 280px;

                align-items: center;
                gap: 60px;
              }

              /* -------------------------
                 TYPOGRAPHY
              ------------------------- */

              .hero-copy {
                padding: 60px 0;
              }

              .eyebrow {
                margin: 0 0 20px;

                font-family: monospace;
                font-size: 0.75rem;
                letter-spacing: 0.15em;

                color: #2563eb;
              }

              .hero h1 {
                margin: 0;

                font-size: clamp(5rem, 13vw, 11rem);
                line-height: 0.82;

                letter-spacing: -0.075em;
                font-weight: 700;
              }

              .hero h1 span {
                color: #2563eb;
              }

              .hero-description {
                max-width: 440px;

                margin: 45px 0 30px;

                font-size: clamp(1rem, 1.5vw, 1.25rem);
                line-height: 1.6;

                color: #666;
              }

              /* -------------------------
                 LINKS
              ------------------------- */

              .links {
                display: flex;
                gap: 25px;
                flex-wrap: wrap;
              }

              .links a {
                padding: 0;

                background: none;
                border: none;
                border-radius: 0;

                color: #111;

                font-family: monospace;
                font-size: 0.75rem;
                letter-spacing: 0.05em;

                text-decoration: none;

                transition: color 0.2s ease;
              }

              .links a:hover {
                color: #2563eb;
                transform: none;
              }

              /* -------------------------
                 PROFILE IMAGE
              ------------------------- */

              .hero-visual {
                min-height: 180px;

                display: flex;
                align-items: center;
                justify-content: center;
              }

              .avatar {
                width: 180px;
                height: 180px;

                border-radius: 50%;
                overflow: hidden;

                position: relative;
                z-index: 2;

                border: 4px solid white;

                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
              }

              .avatar img {
                width: 100%;
                height: 100%;

                object-fit: cover;

                filter: none;
              }

              /* -------------------------
                 SCROLL
              ------------------------- */

              .scroll {
                display: flex;
                align-items: center;
                gap: 12px;

                width: fit-content;

                margin-top: 20px;

                color: #666;

                font-family: monospace;
                font-size: 0.7rem;
                letter-spacing: 0.12em;

                text-decoration: none;
              }

              .scroll:hover {
                color: #2563eb;
              }

              /* -------------------------
                 MOBILE
              ------------------------- */

              @media (max-width: 700px) {

                .hero {
                  min-height: 100vh;
                  padding: 25px 20px;
                }

                .hero-main {
                  grid-template-columns: 1fr;
                  min-height: auto;

                  gap: 20px;
                }

                .hero-copy {
                  padding: 70px 0 30px;
                }

                .hero h1 {
                  font-size: clamp(4.5rem, 22vw, 7rem);
                }

                .hero-description {
                  margin-top: 35px;
                }

                .hero-visual {
                  min-height: 180px;
                }

                .avatar {
                  width: 150px;
                  height: 150px;
                }
              }

              /* =========================
                 DARK MODE BUTTON
              ========================= */

              .theme-toggle {
                position: fixed;
                top: 20px;
                right: 20px;

                width: 45px;
                height: 45px;

                border: 1px solid #e2e8f0;
                border-radius: 50%;

                background: white;
                color: #222;

                font-size: 20px;
                cursor: pointer;

                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

                z-index: 1000;

                transition: 0.2s ease;
              }

              .theme-toggle:hover {
                transform: scale(1.08);
              }

              /* =========================
                 DARK MODE — HERO
              ========================= */

              body.dark .hero {
                background: #0b0d10;
                color: #f1f5f9;
              }

              body.dark .hero-meta {
                border-color: #29303a;
                color: #8b95a5;
              }

              body.dark .eyebrow {
                color: #60a5fa;
              }

              body.dark .hero h1 {
                color: #f1f5f9;
              }

              body.dark .hero h1 span {
                color: #60a5fa;
              }

              body.dark .hero-description {
                color: #a7b0bf;
              }

              body.dark .links a {
                background: transparent;
                border: none;
                color: #e2e8f0;
              }

              body.dark .links a:hover {
                color: #60a5fa;
              }

              body.dark .avatar {
                border-color: #1e293b;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
              }

              body.dark .scroll {
                color: #8b95a5;
              }

              body.dark .scroll:hover {
                color: #60a5fa;
              }

            </style>
          </head>

          <body>

          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            🌙
          </button>

            <!-- =========================
                 INTRODUCTION
            ========================== -->

            <header class="hero">
              <div class="hero-inner">

                <div class="hero-meta">
                  <span>D3.JS / DATA VISUALIZATION</span>
                  <span>2026</span>
                </div>

                <div class="hero-main">

                  <div class="hero-copy">

                    <p class="eyebrow">HELLO, I'M</p>

                    <h1>
                      Fabien<br>
                      <span>Haury</span>
                    </h1>

                    <p class="hero-description">
                      Learning to turn data into visual stories,
                      one experiment at a time.
                    </p>

                    <div class="links">

                      <a
                        href="https://github.com/FabienHaury"
                        target="_blank"
                        rel="noopener noreferrer">
                        GitHub ↗
                      </a>

                      <a
                        href="https://www.linkedin.com/in/fabienhaury/"
                        target="_blank"
                        rel="noopener noreferrer">
                        LinkedIn ↗
                      </a>

                      <a href="mailto:fabienhaury@protonmail.com">
                        Email ↗
                      </a>

                    </div>

                  </div>

                  <div class="hero-visual">

                    <div class="avatar">
                      <img
                        src="./Images/photo_profile.jpg"
                        alt="Fabien Haury">
                    </div>

                  </div>

                </div>

                <a class="scroll" href="#course">
                  <span>SCROLL TO EXPLORE</span>
                  ↓
                </a>

              </div>
            </header>


            <!-- =========================
                 D3.JS COURSE
            ========================== -->

            <main id="course" class="course">

              <div class="course-header">
                <h2>📚 D3.js Course</h2>

                <p>
                  My collection of D3.js projects and exercises.
                </p>
              </div>

          EOF

          for section in */; do
            section="${section%/}"

            # Ignore hidden directories
            [[ "$section" == .* ]] && continue

            # Find projects containing an index.html
            projects=$(find "$section" -mindepth 2 -name "index.html" -type f | sort)

            # Skip sections without projects
            [[ -z "$projects" ]] && continue

            echo "<section class=\"course-section\">" >> index.html
            echo "  <h3>${section//_/ }</h3>" >> index.html
            echo "  <ul>" >> index.html

            while IFS= read -r project; do
              project_dir=$(dirname "$project")
              project_name=$(basename "$project_dir")

              echo "    <li><a href=\"./$project_dir/\">${project_name//-/ }</a></li>" >> index.html
            done <<< "$projects"

            echo "  </ul>" >> index.html
            echo "</section>" >> index.html
          done

          cat >> index.html <<'EOF'

            </main>


            <!-- =========================
                 FOOTER
            ========================== -->

            <footer>
              © 2026 Fabien Haury ·
              <a
                href="https://github.com/FabienHaury"
                target="_blank"
                rel="noopener noreferrer">
                GitHub
              </a>
            </footer>

            <script>
              const themeToggle = document.getElementById("themeToggle");

              // Restore saved theme
              if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark");
                themeToggle.textContent = "☀️";
              }

              themeToggle.addEventListener("click", () => {
                document.body.classList.toggle("dark");

                if (document.body.classList.contains("dark")) {
                  themeToggle.textContent = "☀️";
                  localStorage.setItem("theme", "dark");
                } else {
                  themeToggle.textContent = "🌙";
                  localStorage.setItem("theme", "light");
                }
              });
            </script>


          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
