name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate homepage
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Fabien Haury — D3.js Course</title>

            <style>
              * {
                box-sizing: border-box;
              }

              html {
                scroll-behavior: smooth;
              }

              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f7f7f7;
                color: #222;
              }

              /* =========================
                 INTRO
              ========================= */

              .hero {
                min-height: 70vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 60px 20px;
                background: linear-gradient(
                  135deg,
                  #eff6ff,
                  #ffffff,
                  #f5f3ff
                );
              }

              .hero-content {
                max-width: 800px;
              }

              .avatar {
                  width: 110px;
                  height: 110px;
                  margin: 0 auto 25px;
                  border-radius: 50%;
                  overflow: hidden;
                  box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
                }
                
                .avatar img {
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
                }

              .hero h1 {
                margin: 0;
                font-size: clamp(2.5rem, 7vw, 4.5rem);
                line-height: 1.1;
              }

              .hero h1 span {
                color: #2563eb;
              }

              .hero p {
                max-width: 650px;
                margin: 25px auto;
                color: #64748b;
                font-size: 1.15rem;
                line-height: 1.7;
              }

              .links {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 30px;
              }

              .links a {
                display: inline-block;
                padding: 11px 20px;

                background: white;
                border: 1px solid #e2e8f0;
                border-radius: 999px;

                color: #334155;
                text-decoration: none;
                font-weight: bold;

                transition: 0.2s ease;
              }

              .links a:hover {
                background: #2563eb;
                border-color: #2563eb;
                color: white;
                transform: translateY(-2px);
              }

              .scroll {
                display: inline-block;
                margin-top: 45px;

                color: #64748b;
                text-decoration: none;
                font-size: 0.9rem;
              }

              .scroll:hover {
                color: #2563eb;
              }

              /* =========================
                 COURSE
              ========================= */

              .course {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 20px;
              }

              .course-header {
                margin-bottom: 40px;
              }

              .course-header h2 {
                margin: 0;
                font-size: 2rem;
              }

              .course-header p {
                color: #64748b;
                margin-top: 10px;
              }

              .course-section {
                margin-bottom: 40px;
              }

              .course-section h3 {
                margin-top: 30px;
                margin-bottom: 15px;
                font-size: 1.4rem;
                text-transform: capitalize;
              }

              ul {
                list-style: none;
                padding: 0;
              }

              li {
                margin: 10px 0;
              }

              li a {
                display: block;
                padding: 15px 20px;

                background: white;
                border: 1px solid #e2e8f0;
                border-radius: 8px;

                text-decoration: none;
                color: #2563eb;

                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);

                transition: 0.2s ease;
              }

              li a:hover {
                background: #2563eb;
                color: white;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
              }

              /* =========================
                 FOOTER
              ========================= */

              footer {
                padding: 30px 20px;
                text-align: center;

                border-top: 1px solid #e2e8f0;

                color: #64748b;
                font-size: 0.9rem;
              }

              footer a {
                color: #2563eb;
                text-decoration: none;
              }

              /* =========================
                 MOBILE
              ========================= */

              @media (max-width: 600px) {
                .hero {
                  min-height: 80vh;
                }

                .hero p {
                  font-size: 1rem;
                }

                .course {
                  padding: 50px 20px;
                }
              }

              /* =========================
                 DARK MODE BUTTON
              ========================= */
              
              .theme-toggle {
                position: fixed;
                top: 20px;
                right: 20px;
              
                width: 45px;
                height: 45px;
              
                border: 1px solid #e2e8f0;
                border-radius: 50%;
              
                background: white;
                color: #222;
              
                font-size: 20px;
                cursor: pointer;
              
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
              
                z-index: 1000;
              
                transition: 0.2s ease;
              }
              
              .theme-toggle:hover {
                transform: scale(1.08);
              }
              
              
              /* =========================
                 DARK MODE
              ========================= */
              
              body.dark {
                background: #0f172a;
                color: #e2e8f0;
              }
              
              body.dark .hero {
                background: linear-gradient(
                  135deg,
                  #0f172a,
                  #111827,
                  #1e1b4b
                );
              }
              
              body.dark .hero p {
                color: #94a3b8;
              }
              
              body.dark .links a {
                background: #1e293b;
                border-color: #334155;
                color: #e2e8f0;
              }
              
              body.dark .links a:hover {
                background: #2563eb;
                border-color: #2563eb;
                color: white;
              }
              
              body.dark .scroll {
                color: #94a3b8;
              }
              
              body.dark .course-header p {
                color: #94a3b8;
              }
              
              body.dark .course-section li a {
                background: #1e293b;
                border-color: #334155;
                color: #60a5fa;
              }
              
              body.dark .course-section li a:hover {
                background: #2563eb;
                color: white;
              }
              
              body.dark .theme-toggle {
                background: #1e293b;
                border-color: #334155;
                color: white;
              }
              
              body.dark footer {
                border-color: #334155;
                color: #94a3b8;
              }
              
              body.dark footer a {
                color: #60a5fa;
              }
              
            </style>
          </head>

          <body>

          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            🌙
          </button>

            <!-- =========================
                 INTRODUCTION
            ========================== -->

            <header class="hero">
              <div class="hero-content">

                <div class="avatar">
                <img src="./Images/photo_profile.jpg" alt="Fabien Haury">
                </div>

                <h1>
                  Hi, I'm <span>Fabien Haury</span>
                </h1>

                <p>
                  Welcome to my D3.js course portfolio.
                  Here you can find my projects, exercises and
                  experiments in data visualization.
                </p>

                <div class="links">

                  <a
                    href="https://github.com/FabienHaury"
                    target="_blank"
                    rel="noopener noreferrer">
                    GitHub
                  </a>

                  <a
                    href="https://www.linkedin.com/in/fabienhaury/"
                    target="_blank"
                    rel="noopener noreferrer">
                    LinkedIn
                  </a>

                  <a href="mailto:fabienhaury@protonmail.com">
                    Email
                  </a>

                </div>

                <a class="scroll" href="#course">
                  ↓ Explore my projects
                </a>

              </div>
            </header>


            <!-- =========================
                 D3.JS COURSE
            ========================== -->

            <main id="course" class="course">

              <div class="course-header">
                <h2>📚 D3.js Course</h2>

                <p>
                  My collection of D3.js projects and exercises.
                </p>
              </div>

          EOF

          for section in */; do
            section="${section%/}"

            # Ignore hidden directories
            [[ "$section" == .* ]] && continue

            # Find projects containing an index.html
            projects=$(find "$section" -mindepth 2 -name "index.html" -type f | sort)

            # Skip sections without projects
            [[ -z "$projects" ]] && continue

            echo "<section class=\"course-section\">" >> index.html
            echo "  <h3>${section//_/ }</h3>" >> index.html
            echo "  <ul>" >> index.html

            while IFS= read -r project; do
              project_dir=$(dirname "$project")
              project_name=$(basename "$project_dir")

              echo "    <li><a href=\"./$project_dir/\">${project_name//-/ }</a></li>" >> index.html
            done <<< "$projects"

            echo "  </ul>" >> index.html
            echo "</section>" >> index.html
          done

          cat >> index.html <<'EOF'

            </main>


            <!-- =========================
                 FOOTER
            ========================== -->

            <footer>
              © 2026 Fabien Haury ·
              <a
                href="https://github.com/FabienHaury"
                target="_blank"
                rel="noopener noreferrer">
                GitHub
              </a>
            </footer>

            <script>
              const themeToggle = document.getElementById("themeToggle");
            
              // Restore saved theme
              if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark");
                themeToggle.textContent = "☀️";
              }
            
              themeToggle.addEventListener("click", () => {
                document.body.classList.toggle("dark");
            
                if (document.body.classList.contains("dark")) {
                  themeToggle.textContent = "☀️";
                  localStorage.setItem("theme", "dark");
                } else {
                  themeToggle.textContent = "🌙";
                  localStorage.setItem("theme", "light");
                }
              });
            </script>


          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
