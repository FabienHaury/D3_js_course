name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate homepage
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Fabien Haury — D3.js Course</title>

            <style>
              * {
                box-sizing: border-box;
              }

              html {
                scroll-behavior: smooth;
              }

              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f7f7f7;
                color: #222;
              }

              /* =========================
                 HERO
              ========================= */

              .hero {
                min-height: 90vh;

                display: flex;
                align-items: center;

                padding: 40px clamp(25px, 6vw, 100px);

                background: #f8f8f5;
                color: #111;

                position: relative;
                overflow: hidden;
              }

              .hero-inner {
                width: 100%;
                max-width: 1400px;
                margin: 0 auto;
              }

              /* -------------------------
                 TOP META
              ------------------------- */

              .hero-meta {
                display: flex;
                justify-content: space-between;

                padding-bottom: 18px;

                border-bottom: 1px solid #d8d8d2;

                font-family: monospace;
                font-size: 0.7rem;
                letter-spacing: 0.12em;

                color: #666;
              }

              /* -------------------------
                 MAIN
              ------------------------- */

              .hero-main {
                min-height: 65vh;

                display: flex;
                align-items: center;
                justify-content: center;

                text-align: center;
              }

              .hero-copy {
                padding: 60px 0;

                display: flex;
                flex-direction: column;
                align-items: center;
              }

              /* -------------------------
                 PROFILE IMAGE
              ------------------------- */

              .avatar {
                width: 120px;
                height: 120px;

                margin-bottom: 35px;

                border-radius: 50%;
                overflow: hidden;

                border: 4px solid white;

                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
              }

              .avatar img {
                width: 100%;
                height: 100%;

                object-fit: cover;

                filter: none;
              }

              /* -------------------------
                 TYPOGRAPHY
              ------------------------- */

              .eyebrow {
                margin: 0 0 20px;

                font-family: monospace;
                font-size: 0.75rem;
                letter-spacing: 0.15em;

                color: #2563eb;
              }

              .hero h1 {
                margin: 0;

                font-size: clamp(5rem, 13vw, 11rem);
                line-height: 0.82;

                letter-spacing: -0.075em;
                font-weight: 700;
              }

              .hero h1 span {
                color: #2563eb;
              }

              .hero-description {
                max-width: 440px;

                margin: 45px auto 30px;

                font-size: clamp(1rem, 1.5vw, 1.25rem);
                line-height: 1.6;

                color: #666;
              }

              /* -------------------------
                 LINKS
              ------------------------- */

              .links {
                display: flex;
                justify-content: center;
                gap: 25px;
                flex-wrap: wrap;
              }

              .links a {
                padding: 0;

                background: none;
                border: none;
                border-radius: 0;

                color: #111;

                font-family: monospace;
                font-size: 0.75rem;
                letter-spacing: 0.05em;

                text-decoration: none;

                transition: color 0.2s ease;
              }

              .links a:hover {
                color: #2563eb;
                transform: none;
              }

              /* -------------------------
                 SCROLL
              ------------------------- */

              .scroll {
                display: flex;
                align-items: center;
                justify-content: center;

                gap: 12px;

                width: fit-content;

                margin: 20px auto 0;

                color: #666;

                font-family: monospace;
                font-size: 0.7rem;
                letter-spacing: 0.12em;

                text-decoration: none;
              }

              .scroll:hover {
                color: #2563eb;
              }

              /* =========================
                 COURSE
              ========================= */

              .course {
                width: 100%;
                max-width: 1000px;

                margin: 0 auto;
                padding: 90px 25px;

                text-align: center;
              }

              .course-header {
                margin-bottom: 55px;
              }

              .course-header h2 {
                margin: 0;

                font-size: 2rem;
              }

              .course-header p {
                margin-top: 10px;

                color: #64748b;
              }

              .course-section {
                margin-bottom: 55px;
              }

              .course-section h3 {
                margin: 0 0 20px;

                font-size: 1.4rem;

                text-transform: capitalize;
              }

              .course-section ul {
                width: 100%;
                max-width: 700px;

                margin: 0 auto;

                padding: 0;

                list-style: none;
              }

              .course-section li {
                margin: 10px 0;
              }

              .course-section li a {
                display: block;

                padding: 15px 20px;

                background: white;

                border: 1px solid #e2e8f0;
                border-radius: 8px;

                text-decoration: none;

                color: #2563eb;

                text-align: center;

                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);

                transition: 0.2s ease;
              }

              .course-section li a:hover {
                background: #2563eb;
                color: white;

                transform: translateY(-2px);

                box-shadow:
                  0 5px 15px rgba(0, 0, 0, 0.1);
              }

              /* =========================
                 FOOTER
              ========================= */

              footer {
                width: 100%;

                padding: 30px 20px;

                display: flex;
                justify-content: center;
                align-items: center;

                text-align: center;

                border-top: 1px solid #e2e8f0;

                color: #64748b;

                font-size: 0.9rem;
              }

              footer a {
                margin-left: 4px;

                color: #2563eb;

                text-decoration: none;
              }

              /* =========================
                 MOBILE
              ========================= */

              @media (max-width: 700px) {

                .hero {
                  min-height: 100vh;
                  padding: 25px 20px;
                }

                .hero-main {
                  min-height: auto;
                }

                .hero-copy {
                  padding: 60px 0 30px;
                }

                .hero h1 {
                  font-size: clamp(4.5rem, 22vw, 7rem);
                }

                .hero-description {
                  margin-top: 35px;
                }

                .avatar {
                  width: 110px;
                  height: 110px;

                  margin-bottom: 30px;
                }

                .course {
                  padding: 60px 20px;
                }
              }

              /* =========================
                 DARK MODE BUTTON
              ========================= */

              .theme-toggle {
                position: fixed;

                top: 20px;
                right: 20px;

                width: 45px;
                height: 45px;

                border: 1px solid #e2e8f0;
                border-radius: 50%;

                background: white;
                color: #222;

                font-size: 20px;

                cursor: pointer;

                box-shadow:
                  0 2px 8px rgba(0, 0, 0, 0.1);

                z-index: 1000;

                transition: 0.2s ease;
              }

              .theme-toggle:hover {
                transform: scale(1.08);
              }

              /* =========================
                 DARK MODE
              ========================= */

              body.dark .hero {
                background: #0b0d10;
                color: #f1f5f9;
              }

              body.dark .hero-meta {
                border-color: #29303a;
                color: #8b95a5;
              }

              body.dark .eyebrow {
                color: #60a5fa;
              }

              body.dark .hero h1 {
                color: #f1f5f9;
              }

              body.dark .hero h1 span {
                color: #60a5fa;
              }

              body.dark .hero-description {
                color: #a7b0bf;
              }

              body.dark .links a {
                background: transparent;
                border: none;
                color: #e2e8f0;
              }

              body.dark .links a:hover {
                color: #60a5fa;
              }

              body.dark .avatar {
                border-color: #1e293b;

                box-shadow:
                  0 10px 30px rgba(0, 0, 0, 0.35);
              }

              body.dark .scroll {
                color: #8b95a5;
              }

              body.dark .scroll:hover {
                color: #60a5fa;
              }

              body.dark .course {
                background: #0f1115;
                color: #f1f5f9;
              }

              body.dark .course-header p {
                color: #94a3b8;
              }

              body.dark .course-section li a {
                background: #1e293b;
                border-color: #334155;
                color: #60a5fa;
              }

              body.dark .course-section li a:hover {
                background: #2563eb;
                color: white;
              }

              body.dark footer {
                border-color: #29303a;
                color: #94a3b8;
                background: #0b0d10;
              }

              body.dark footer a {
                color: #60a5fa;
              }

            </style>
          </head>

          <body>

          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle dark mode">
            🌙
          </button>

            <!-- =========================
                 INTRODUCTION
            ========================== -->

            <header class="hero">

              <div class="hero-inner">

                <div class="hero-meta">
                  <span>D3.JS / DATA VISUALIZATION</span>
                  <span>2026</span>
                </div>

                <div class="hero-main">

                  <div class="hero-copy">

                    <div class="avatar">
                      <img
                        src="./Images/photo_profile.jpg"
                        alt="Fabien Haury">
                    </div>

                    <p class="eyebrow">
                      HELLO, I'M
                    </p>

                    <h1>
                      Fabien<br>
                      <span>Haury</span>
                    </h1>

                    <p class="hero-description">
                      Learning to turn data into visual stories,
                      one experiment at a time.
                    </p>

                    <div class="links">

                      <a
                        href="https://www.react-graph-gallery.com/react-d3-dataviz-course"
                        target="_blank"
                        rel="noopener noreferrer">
                        D3.js Course ↗
                      </a>
                    
                      <a
                        href="https://github.com/FabienHaury"
                        target="_blank"
                        rel="noopener noreferrer">
                        GitHub ↗
                      </a>
                    
                      <a
                        href="https://www.linkedin.com/in/fabienhaury/"
                        target="_blank"
                        rel="noopener noreferrer">
                        LinkedIn ↗
                      </a>
                    
                      <a
                        href="mailto:fabienhaury@protonmail.com">
                        Email ↗
                      </a>
                    
                    </div>

                  </div>

                </div>

                <a
                  class="scroll"
                  href="#course">
                  <span>SCROLL TO EXPLORE</span>
                  ↓
                </a>

              </div>

            </header>


            <!-- =========================
                 D3.JS COURSE
            ========================== -->

            <main id="course" class="course">

              <div class="course-header">

                <h2>📚 D3.js Course</h2>

                <p>
                  My collection of D3.js projects and exercises.
                </p>

              </div>

          EOF

          for section in */; do
            section="${section%/}"

            # Ignore hidden directories
            [[ "$section" == .* ]] && continue

            # Find projects containing an index.html
            projects=$(find "$section" -mindepth 2 -name "index.html" -type f | sort)

            # Skip sections without projects
            [[ -z "$projects" ]] && continue

            echo "<section class=\"course-section\">" >> index.html
            echo "  <h3>${section//_/ }</h3>" >> index.html
            echo "  <ul>" >> index.html

            while IFS= read -r project; do
              project_dir=$(dirname "$project")
              project_name=$(basename "$project_dir")

              echo "    <li><a href=\"./$project_dir/\">${project_name//-/ }</a></li>" >> index.html
            done <<< "$projects"

            echo "  </ul>" >> index.html
            echo "</section>" >> index.html
          done

          cat >> index.html <<'EOF'

            </main>


            <!-- =========================
                 FOOTER
            ========================== -->

            <footer>

              © 2026 Fabien Haury ·

              <a
                href="https://github.com/FabienHaury"
                target="_blank"
                rel="noopener noreferrer">
                GitHub
              </a>

            </footer>


            <script>

              const themeToggle =
                document.getElementById("themeToggle");

              // Restore saved theme
              if (localStorage.getItem("theme") === "dark") {

                document.body.classList.add("dark");

                themeToggle.textContent = "☀️";

              }

              themeToggle.addEventListener("click", () => {

                document.body.classList.toggle("dark");

                if (document.body.classList.contains("dark")) {

                  themeToggle.textContent = "☀️";

                  localStorage.setItem("theme", "dark");

                } else {

                  themeToggle.textContent = "🌙";

                  localStorage.setItem("theme", "light");

                }

              });

            </script>


          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
