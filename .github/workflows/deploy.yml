- name: Generate homepage
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Fabien Haury — D3.js & Data Visualization</title>

            <style>
              :root {
                --bg: #f7f7f4;
                --surface: #ffffff;
                --text: #111827;
                --muted: #64748b;
                --border: #dbe1e8;
                --grid: #e5e7eb;
                --accent: #2563eb;
                --accent-2: #7c3aed;
                --viz: #2563eb;
                --viz-soft: #93c5fd;
              }

              * {
                box-sizing: border-box;
              }

              html {
                scroll-behavior: smooth;
              }

              body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                  Inter, ui-sans-serif, system-ui, -apple-system,
                  BlinkMacSystemFont, "Segoe UI", sans-serif;
                transition:
                  background 0.3s ease,
                  color 0.3s ease;
              }

              a {
                color: inherit;
              }

              /* =========================
                 DARK MODE
              ========================= */

              body.dark {
                --bg: #080b12;
                --surface: #111827;
                --text: #f1f5f9;
                --muted: #94a3b8;
                --border: #273244;
                --grid: #1e293b;
                --accent: #60a5fa;
                --accent-2: #a78bfa;
                --viz: #60a5fa;
                --viz-soft: #334155;
              }

              /* =========================
                 THEME BUTTON
              ========================= */

              .theme-toggle {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 100;

                width: 44px;
                height: 44px;

                display: grid;
                place-items: center;

                border: 1px solid var(--border);
                border-radius: 50%;

                background: var(--surface);
                color: var(--text);

                cursor: pointer;
                font-size: 17px;

                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

                transition:
                  transform 0.2s ease,
                  background 0.3s ease,
                  border-color 0.3s ease;
              }

              .theme-toggle:hover {
                transform: scale(1.08);
              }

              /* =========================
                 HERO
              ========================= */

              .hero {
                position: relative;
                min-height: 100vh;

                display: flex;
                align-items: center;

                overflow: hidden;

                border-bottom: 1px solid var(--border);
              }

              .hero-inner {
                width: min(1180px, calc(100% - 40px));
                margin: auto;

                display: grid;
                grid-template-columns: 1fr 1.2fr;
                gap: 60px;
                align-items: center;
              }

              .hero-copy {
                position: relative;
                z-index: 2;
              }

              .eyebrow {
                margin-bottom: 22px;

                color: var(--accent);
                font-family: monospace;
                font-size: 0.78rem;
                font-weight: 700;
                letter-spacing: 0.15em;
                text-transform: uppercase;
              }

              .hero h1 {
                margin: 0;

                font-size: clamp(3.5rem, 9vw, 7rem);
                line-height: 0.9;
                letter-spacing: -0.07em;
              }

              .hero h1 span {
                display: block;
                color: var(--accent);
              }

              .hero-description {
                max-width: 540px;
                margin: 30px 0 0;

                color: var(--muted);
                font-size: clamp(1rem, 2vw, 1.2rem);
                line-height: 1.7;
              }

              .hero-description strong {
                color: var(--text);
              }

              .hero-links {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;

                margin-top: 32px;
              }

              .hero-links a {
                padding: 10px 17px;

                border: 1px solid var(--border);
                border-radius: 999px;

                background: var(--surface);

                text-decoration: none;
                font-size: 0.9rem;
                font-weight: 600;

                transition:
                  color 0.2s ease,
                  background 0.2s ease,
                  border-color 0.2s ease,
                  transform 0.2s ease;
              }

              .hero-links a:hover {
                color: white;
                background: var(--accent);
                border-color: var(--accent);
                transform: translateY(-2px);
              }

              /* =========================
                 PROFILE
              ========================= */

              .profile {
                display: flex;
                align-items: center;
                gap: 12px;

                margin-top: 42px;

                color: var(--muted);
                font-size: 0.78rem;
              }

              .avatar {
                width: 38px;
                height: 38px;

                overflow: hidden;

                border: 1px solid var(--border);
                border-radius: 50%;
              }

              .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
              }

              /* =========================
                 HERO VISUALIZATION
              ========================= */

              .hero-viz {
                position: relative;

                min-height: 520px;

                display: flex;
                align-items: center;
                justify-content: center;
              }

              #network {
                width: 100%;
                height: 520px;

                overflow: visible;
              }

              .viz-label {
                position: absolute;
                left: 50%;
                bottom: 22px;

                transform: translateX(-50%);

                color: var(--muted);

                font-family: monospace;
                font-size: 0.68rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;

                pointer-events: none;
              }

              .node {
                cursor: pointer;
              }

              .node circle {
                fill: var(--surface);
                stroke: var(--viz);
                stroke-width: 2;
                transition:
                  r 0.2s ease,
                  fill 0.2s ease;
              }

              .node text {
                fill: var(--muted);
                font-family: monospace;
                font-size: 10px;
                pointer-events: none;
              }

              .node:hover circle {
                fill: var(--viz);
              }

              .node:hover text {
                fill: var(--text);
              }

              .link {
                stroke: var(--viz-soft);
                stroke-width: 1;
                opacity: 0.45;
              }

              /* =========================
                 SCROLL
              ========================= */

              .scroll-indicator {
                position: absolute;
                left: 50%;
                bottom: 28px;

                transform: translateX(-50%);

                color: var(--muted);

                font-family: monospace;
                font-size: 0.7rem;
                letter-spacing: 0.12em;
                text-decoration: none;
                text-transform: uppercase;
              }

              .scroll-indicator span {
                display: block;
                margin-top: 8px;

                text-align: center;
                font-size: 1rem;
              }

              /* =========================
                 MAIN
              ========================= */

              main {
                width: min(1100px, calc(100% - 40px));
                margin: auto;
              }

              section {
                padding: 120px 0;
              }

              .section-header {
                display: grid;
                grid-template-columns: 100px 1fr;
                gap: 30px;

                margin-bottom: 55px;
              }

              .section-number {
                color: var(--accent);

                font-family: monospace;
                font-size: 0.75rem;
                letter-spacing: 0.1em;
              }

              .section-header h2 {
                max-width: 700px;
                margin: 0;

                font-size: clamp(2rem, 5vw, 3.5rem);
                line-height: 1;
                letter-spacing: -0.045em;
              }

              .section-header p {
                max-width: 600px;
                margin: 18px 0 0;

                color: var(--muted);
                line-height: 1.7;
              }

              /* =========================
                 JOURNEY
              ========================= */

              .journey {
                position: relative;

                display: grid;
                gap: 0;

                border-top: 1px solid var(--border);
              }

              .journey::before {
                content: "";

                position: absolute;
                top: 0;
                bottom: 0;
                left: 15px;

                width: 1px;

                background: var(--border);
              }

              .journey-item {
                position: relative;

                display: grid;
                grid-template-columns: 32px 1fr auto;
                gap: 24px;
                align-items: center;

                padding: 23px 0;

                border-bottom: 1px solid var(--border);

                text-decoration: none;
              }

              .journey-dot {
                position: relative;
                z-index: 2;

                width: 10px;
                height: 10px;

                margin-left: 10px;

                border: 2px solid var(--accent);
                border-radius: 50%;

                background: var(--bg);

                transition:
                  background 0.2s ease,
                  transform 0.2s ease;
              }

              .journey-item:hover .journey-dot {
                background: var(--accent);
                transform: scale(1.4);
              }

              .journey-title {
                font-size: 1.1rem;
                font-weight: 600;
              }

              .journey-description {
                margin-top: 4px;

                color: var(--muted);
                font-family: monospace;
                font-size: 0.72rem;
              }

              .journey-arrow {
                color: var(--muted);
                transition: transform 0.2s ease;
              }

              .journey-item:hover .journey-arrow {
                color: var(--accent);
                transform: translateX(5px);
              }

              /* =========================
                 PROJECTS
              ========================= */

              .project-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
              }

              .project {
                position: relative;

                min-height: 230px;

                display: flex;
                flex-direction: column;
                justify-content: space-between;

                padding: 25px;

                overflow: hidden;

                border: 1px solid var(--border);
                background: var(--surface);

                text-decoration: none;

                transition:
                  transform 0.25s ease,
                  border-color 0.25s ease;
              }

              .project:hover {
                transform: translateY(-5px);
                border-color: var(--accent);
              }

              .project-number {
                color: var(--muted);

                font-family: monospace;
                font-size: 0.7rem;
              }

              .project h3 {
                margin: 45px 0 6px;

                font-size: 1.35rem;
                letter-spacing: -0.025em;
              }

              .project-section {
                color: var(--accent);

                font-family: monospace;
                font-size: 0.68rem;
                text-transform: uppercase;
              }

              .project-graphic {
                position: absolute;
                right: -15px;
                top: -15px;

                width: 150px;
                height: 150px;

                opacity: 0.15;

                transition:
                  opacity 0.25s ease,
                  transform 0.25s ease;
              }

              .project:hover .project-graphic {
                opacity: 0.4;
                transform: rotate(10deg) scale(1.05);
              }

              .project-graphic circle {
                fill: none;
                stroke: var(--accent);
                stroke-width: 1;
              }

              .project-graphic line {
                stroke: var(--accent);
                stroke-width: 1;
              }

              /* =========================
                 FOOTER
              ========================= */

              footer {
                padding: 50px 20px;

                border-top: 1px solid var(--border);

                color: var(--muted);

                font-family: monospace;
                font-size: 0.72rem;

                text-align: center;
              }

              footer a {
                color: var(--accent);
                text-decoration: none;
              }

              /* =========================
                 RESPONSIVE
              ========================= */

              @media (max-width: 800px) {
                .hero {
                  min-height: auto;
                  padding: 110px 0 80px;
                }

                .hero-inner {
                  grid-template-columns: 1fr;
                  gap: 30px;
                }

                .hero-viz {
                  min-height: 380px;
                }

                #network {
                  height: 380px;
                }

                .section-header {
                  grid-template-columns: 50px 1fr;
                  gap: 15px;
                }
              }

              @media (max-width: 600px) {
                main {
                  width: min(100% - 30px, 1100px);
                }

                .hero-inner {
                  width: min(100% - 30px, 1180px);
                }

                .hero h1 {
                  font-size: clamp(3.2rem, 17vw, 5rem);
                }

                .hero-viz {
                  min-height: 320px;
                }

                #network {
                  height: 320px;
                }

                section {
                  padding: 80px 0;
                }

                .project-grid {
                  grid-template-columns: 1fr;
                }

                .journey-item {
                  grid-template-columns: 32px 1fr 20px;
                  gap: 15px;
                }
              }

              @media (prefers-reduced-motion: reduce) {
                html {
                  scroll-behavior: auto;
                }

                *,
                *::before,
                *::after {
                  transition-duration: 0.01ms !important;
                  animation-duration: 0.01ms !important;
                }
              }
            </style>
          </head>

          <body>

            <button
              class="theme-toggle"
              id="themeToggle"
              aria-label="Toggle dark mode">
              ◐
            </button>

            <header class="hero">

              <div class="hero-inner">

                <div class="hero-copy">

                  <div class="eyebrow">
                    D3.js · Data Visualization · Learning in public
                  </div>

                  <h1>
                    Fabien
                    <span>Haury.</span>
                  </h1>

                  <p class="hero-description">
                    I'm learning to turn <strong>data into visual stories</strong>
                    using D3.js, React and the web.
                  </p>

                  <div class="hero-links">

                    <a
                      href="https://github.com/FabienHaury"
                      target="_blank"
                      rel="noopener noreferrer">
                      GitHub ↗
                    </a>

                    <a
                      href="https://www.linkedin.com/in/fabienhaury/"
                      target="_blank"
                      rel="noopener noreferrer">
                      LinkedIn ↗
                    </a>

                    <a href="mailto:fabienhaury@protonmail.com">
                      Email
                    </a>

                  </div>

                  <div class="profile">

                    <div class="avatar">
                      <img
                        src="./Images/photo_profile.jpg"
                        alt="Fabien Haury">
                    </div>

                    <span>
                      D3.js course portfolio
                    </span>

                  </div>

                </div>


                <div class="hero-viz">

                  <svg
                    id="network"
                    role="img"
                    aria-label="Interactive visualization of D3.js concepts">
                  </svg>

                  <div class="viz-label">
                    move your cursor · explore the network
                  </div>

                </div>

              </div>

              <a
                class="scroll-indicator"
                href="#journey">
                explore
                <span>↓</span>
              </a>

            </header>


            <main>

              <!-- =========================
                   JOURNEY
              ========================== -->

              <section id="journey">

                <div class="section-header">

                  <div class="section-number">
                    01
                  </div>

                  <div>

                    <h2>
                      The journey
                    </h2>

                    <p>
                      From the foundations of web development to interactive
                      data visualization, these are the concepts I'm exploring.
                    </p>

                  </div>

                </div>


                <div class="journey">

                  <a class="journey-item" href="#projects">

                    <div class="journey-dot"></div>

                    <div>
                      <div class="journey-title">
                        Web Development
                      </div>

                      <div class="journey-description">
                        HTML · CSS · JavaScript
                      </div>
                    </div>

                    <div class="journey-arrow">→</div>

                  </a>


                  <a class="journey-item" href="#projects">

                    <div class="journey-dot"></div>

                    <div>
                      <div class="journey-title">
                        React
                      </div>

                      <div class="journey-description">
                        Components · State · Data
                      </div>
                    </div>

                    <div class="journey-arrow">→</div>

                  </a>


                  <a class="journey-item" href="#projects">

                    <div class="journey-dot"></div>

                    <div>
                      <div class="journey-title">
                        SVG & D3.js
                      </div>

                      <div class="journey-description">
                        Shapes · Scales · Coordinates
                      </div>
                    </div>

                    <div class="journey-arrow">→</div>

                  </a>


                  <a class="journey-item" href="#projects">

                    <div class="journey-dot"></div>

                    <div>
                      <div class="journey-title">
                        Visualization
                      </div>

                      <div class="journey-description">
                        Axes · Charts · Data
                      </div>
                    </div>

                    <div class="journey-arrow">→</div>

                  </a>


                  <a class="journey-item" href="#projects">

                    <div class="journey-dot"></div>

                    <div>
                      <div class="journey-title">
                        Interaction
                      </div>

                      <div class="journey-description">
                        Hover · Tooltips · Responsive
                      </div>
                    </div>

                    <div class="journey-arrow">→</div>

                  </a>


                  <a class="journey-item" href="#projects">

                    <div class="journey-dot"></div>

                    <div>
                      <div class="journey-title">
                        Animation
                      </div>

                      <div class="journey-description">
                        Transitions · Motion · Performance
                      </div>
                    </div>

                    <div class="journey-arrow">→</div>

                  </a>

                </div>

              </section>


              <!-- =========================
                   PROJECTS
              ========================== -->

              <section id="projects">

                <div class="section-header">

                  <div class="section-number">
                    02
                  </div>

                  <div>

                    <h2>
                      My projects
                    </h2>

                    <p>
                      Experiments, exercises and visualizations built
                      throughout the course.
                    </p>

                  </div>

                </div>


                <div class="project-grid">

          EOF


          # =========================================
          # AUTOMATIC PROJECT DISCOVERY
          # =========================================

          project_count=0

          for section in */; do

            section="${section%/}"

            # Ignore hidden directories
            [[ "$section" == .* ]] && continue

            # Ignore common repository directories
            [[ "$section" == "Images" ]] && continue

            projects=$(find "$section" \
              -mindepth 2 \
              -name "index.html" \
              -type f \
              | sort)

            [[ -z "$projects" ]] && continue

            while IFS= read -r project; do

              project_dir=$(dirname "$project")
              project_name=$(basename "$project_dir")

              project_count=$((project_count + 1))

              # Create a simple deterministic visual based on the project index.
              angle=$((project_count * 37 % 360))

              cat >> index.html <<EOF

                  <a
                    class="project"
                    href="./$project_dir/"
                  >

                    <div class="project-number">
                      $(printf "%02d" "$project_count")
                    </div>

                    <svg
                      class="project-graphic"
                      viewBox="0 0 150 150"
                      aria-hidden="true"
                      style="transform: rotate(${angle}deg)"
                    >

                      <circle
                        cx="75"
                        cy="75"
                        r="52">
                      </circle>

                      <circle
                        cx="75"
                        cy="75"
                        r="30">
                      </circle>

                      <circle
                        cx="75"
                        cy="75"
                        r="8">
                      </circle>

                      <line
                        x1="20"
                        y1="75"
                        x2="130"
                        y2="75">
                      </line>

                      <line
                        x1="75"
                        y1="20"
                        x2="75"
                        y2="130">
                      </line>

                    </svg>

                    <div>

                      <h3>
                        ${project_name//-/ }
                      </h3>

                      <div class="project-section">
                        ${section//_/ }
                      </div>

                    </div>

                  </a>

          EOF

            done <<< "$projects"

          done


          cat >> index.html <<'EOF'

                </div>

              </section>


              <!-- =========================
                   ABOUT THE COURSE
              ========================== -->

              <section>

                <div class="section-header">

                  <div class="section-number">
                    03
                  </div>

                  <div>

                    <h2>
                      Learning by building.
                    </h2>

                    <p>
                      This portfolio documents my progress through the
                      D3.js & React Data Visualization course by Yan Holtz.
                      Each project is an opportunity to experiment with
                      data, interaction and visual storytelling.
                    </p>

                    <p style="margin-top: 25px;">

                      <a
                        href="https://www.react-graph-gallery.com/react-d3-dataviz-course"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                          color: var(--accent);
                          text-decoration: none;
                          font-family: monospace;
                          font-size: 0.8rem;
                        ">
                        VIEW THE COURSE ↗
                      </a>

                    </p>

                  </div>

                </div>

              </section>

            </main>


            <footer>

              © 2026 Fabien Haury ·
              <a
                href="https://github.com/FabienHaury"
                target="_blank"
                rel="noopener noreferrer">
                GitHub
              </a>

            </footer>


            <!-- =========================
                 D3
            ========================== -->

            <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

            <script>

              /* =====================================
                 THEME
              ===================================== */

              const themeToggle =
                document.getElementById("themeToggle");

              const savedTheme =
                localStorage.getItem("theme");

              if (savedTheme === "dark") {
                document.body.classList.add("dark");
                themeToggle.textContent = "☀";
              }

              themeToggle.addEventListener("click", () => {

                document.body.classList.toggle("dark");

                const dark =
                  document.body.classList.contains("dark");

                themeToggle.textContent =
                  dark ? "☀" : "◐";

                localStorage.setItem(
                  "theme",
                  dark ? "dark" : "light"
                );

              });


              /* =====================================
                 D3 NETWORK
              ===================================== */

              const svg =
                d3.select("#network");

              const container =
                document.querySelector(".hero-viz");

              const reducedMotion =
                window.matchMedia(
                  "(prefers-reduced-motion: reduce)"
                ).matches;


              function createNetwork() {

                svg.selectAll("*").remove();

                const width =
                  container.clientWidth;

                const height =
                  container.clientHeight;


                svg
                  .attr("viewBox", `0 0 ${width} ${height}`);


                /*
                 * These represent the concepts explored
                 * throughout the course.
                 */

                const nodes = [

                  {
                    id: "D3.js",
                    group: 0,
                    radius: 14
                  },

                  {
                    id: "SVG",
                    group: 1,
                    radius: 8
                  },

                  {
                    id: "Scales",
                    group: 1,
                    radius: 8
                  },

                  {
                    id: "Axes",
                    group: 1,
                    radius: 7
                  },

                  {
                    id: "Data",
                    group: 2,
                    radius: 9
                  },

                  {
                    id: "Interaction",
                    group: 2,
                    radius: 8
                  },

                  {
                    id: "Animation",
                    group: 2,
                    radius: 7
                  },

                  {
                    id: "React",
                    group: 3,
                    radius: 9
                  },

                  {
                    id: "Charts",
                    group: 3,
                    radius: 8
                  },

                  {
                    id: "Storytelling",
                    group: 3,
                    radius: 10
                  }

                ];


                const links = [

                  ["D3.js", "SVG"],
                  ["D3.js", "Scales"],
                  ["D3.js", "Data"],
                  ["D3.js", "Interaction"],
                  ["D3.js", "React"],
                  ["SVG", "Axes"],
                  ["Scales", "Axes"],
                  ["Data", "Charts"],
                  ["Interaction", "Charts"],
                  ["Interaction", "Animation"],
                  ["Animation", "Storytelling"],
                  ["Charts", "Storytelling"],
                  ["React", "Interaction"]

                ].map(([source, target]) => ({
                  source,
                  target
                }));


                const simulation =
                  d3.forceSimulation(nodes)

                    .force(
                      "link",
                      d3.forceLink(links)
                        .id(d => d.id)
                        .distance(75)
                        .strength(0.65)
                    )

                    .force(
                      "charge",
                      d3.forceManyBody()
                        .strength(-170)
                    )

                    .force(
                      "center",
                      d3.forceCenter(
                        width / 2,
                        height / 2
                      )
                    )

                    .force(
                      "collision",
                      d3.forceCollide()
                        .radius(d => d.radius + 15)
                    );


                const link =
                  svg
                    .append("g")
                    .selectAll("line")
                    .data(links)
                    .join("line")
                    .attr("class", "link");


                const node =
                  svg
                    .append("g")
                    .selectAll("g")
                    .data(nodes)
                    .join("g")
                    .attr("class", "node");


                node
                  .append("circle")
                  .attr("r", d => d.radius);


                node
                  .append("text")
                  .attr("x", d => d.radius + 6)
                  .attr("y", 3)
                  .text(d => d.id);


                /*
                 * Mouse interaction.
                 */

                const mouse =
                  d3.pointer;


                svg.on("mousemove", function(event) {

                  if (reducedMotion) return;

                  const [mx, my] =
                    mouse(event, this);

                  simulation
                    .force(
                      "mouse",
                      d3.forceRadial(
                        90,
                        mx,
                        my
                      ).strength(0.018)
                    )
                    .alpha(0.15)
                    .restart();

                });


                svg.on("mouseleave", function() {

                  simulation
                    .force("mouse", null)
                    .alpha(0.15)
                    .restart();

                });


                /*
                 * Drag interaction.
                 */

                if (!reducedMotion) {

                  node.call(

                    d3.drag()

                      .on("start", function(event, d) {

                        if (!event.active) {
                          simulation.alphaTarget(0.3).restart();
                        }

                        d.fx = d.x;
                        d.fy = d.y;

                      })

                      .on("drag", function(event, d) {

                        d.fx = event.x;
                        d.fy = event.y;

                      })

                      .on("end", function(event, d) {

                        if (!event.active) {
                          simulation.alphaTarget(0);
                        }

                        d.fx = null;
                        d.fy = null;

                      })

                  );

                }


                simulation.on("tick", () => {

                  link

                    .attr(
                      "x1",
                      d => d.source.x
                    )

                    .attr(
                      "y1",
                      d => d.source.y
                    )

                    .attr(
                      "x2",
                      d => d.target.x
                    )

                    .attr(
                      "y2",
                      d => d.target.y
                    );


                  node.attr(
                    "transform",
                    d =>
                      `translate(${d.x},${d.y})`
                  );

                });

              }


              createNetwork();


              /* =====================================
                 RESPONSIVE
              ===================================== */

              let resizeTimer;

              window.addEventListener(
                "resize",
                () => {

                  clearTimeout(resizeTimer);

                  resizeTimer =
                    setTimeout(
                      createNetwork,
                      150
                    );

                }
              );

            </script>

          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
